name: 'Set Up Node.js'
description: 'Set up Node.js using the version specified in .nvmrc'

outputs:
  node-version:
    description: 'The Node.js version that was set up'
    value: ${{ steps.nvm.outputs.NVMRC }}

runs:
  using: 'composite'
  steps:
    - name: Read .nvmrc
      id: nvm
      shell: bash
      run: |
        if [[ -f .nvmrc && -s .nvmrc ]]; then
          read -r NVMRC_CONTENT < .nvmrc
        else
          echo "⚠️ .nvmrc file missing or empty, defaulting to LTS"
          NVMRC_CONTENT="lts/*"
        fi
        printf 'NVMRC=%s\n' "$NVMRC_CONTENT" >> $GITHUB_OUTPUT
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "${{ steps.nvm.outputs.NVMRC }}"
        # npm caching is handled by the install-dependencies action instead,
        # which saves the cache as soon as npm ci succeeds; setup-node's
        # built-in cache only saves when the whole job succeeds (post-if:
        # success()) and restores on exact lock-file match only. Explicitly
        # disabled here because package.json has a `packageManager` field,
        # which would otherwise auto-enable the built-in cache.
        package-manager-cache: false
    - name: Verify Node.js setup
      shell: bash
      run: echo "✅ Node $(node -v), npm $(npm -v)"
