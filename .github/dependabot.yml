version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    rebase-strategy: disabled
    open-pull-requests-limit: 10
    schedule:
      interval: "daily"
      time: "18:49"
      timezone: "Europe/Stockholm"
    # Only default-days is valid here -- Dependabot rejects the semver-granular
    # cooldown keys for github-actions.
    cooldown:
      default-days: 5
  - package-ecosystem: "npm"
    directory: "/"
    rebase-strategy: disabled
    open-pull-requests-limit: 10
    versioning-strategy: increase
    schedule:
      interval: "daily"
      time: "18:49"
      timezone: "Europe/Stockholm"
    cooldown:
      default-days: 5
      semver-major-days: 7
      semver-minor-days: 5
      semver-patch-days: 5
    groups:
      lint:
        patterns:
          - "@typescript-eslint/*"
          - "eslint"
          - "eslint-*"
          - "prettier"
      react:
        patterns:
          - "react"
          - "react-dom"
      # `@rjsf/core` peer-requires a matching `@rjsf/utils`, so the packages
      # can only be updated together.
      rjsf:
        patterns:
          - "@rjsf/*"
    ignore:
      - dependency-name: "material-components-web"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@stencil/core"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "replace-in-file"
        update-types: ["version-update:semver-major"]
